# Conformance test profile: real easytier-core containers driven by
# test/conformance/*.test.ts.
#
#   docker compose -f docker-compose.test.yml --profile test up -d core-ws
#   bun run test:conformance
#
# The easytier-core containers use host networking so they can reach the
# vitest-hosted server on 127.0.0.1 (Linux only; CI uses Linux runners).
name: easyplane-conformance

x-core: &core
  build:
    context: ./docker/easytier-core
  image: easyplane/easytier-core-test:2.6.4-81487c36
  profiles: ["test"]
  network_mode: host
  cap_add: ["NET_ADMIN"]
  devices: ["/dev/net/tun:/dev/net/tun"]
  restart: "no"
  environment:
    RUST_LOG: ${EASYPLANE_CORE_LOG:-info}
    ET_LOG: ${EASYPLANE_CORE_LOG:-info}

# M2 mesh: three clients on an isolated bridge network. Each container has its
# own network namespace, so every instance gets its own TUN device and routing
# table (host networking would put three TUNs of the same /24 in one namespace).
# They reach the vitest-hosted control plane through host.docker.internal, and
# each other through the compose service names used in the pushed peer URLs.
x-m2-core: &m2-core
  build:
    context: ./docker/easytier-core
  image: easyplane/easytier-core-test:2.6.4-81487c36
  profiles: ["test"]
  cap_add: ["NET_ADMIN"]
  devices: ["/dev/net/tun:/dev/net/tun"]
  networks: ["m2"]
  restart: "no"
  environment:
    RUST_LOG: ${EASYPLANE_CORE_LOG:-info}
    ET_LOG: ${EASYPLANE_CORE_LOG:-info}


services:
  core-ws:
    <<: *core
    container_name: easyplane-core-ws
    command:
      - --config-server
      - ${EASYPLANE_CORE_WS_URL:-ws://127.0.0.1:22080/token-ws}
      - --machine-id
      - 11111111-1111-4111-8111-111111111111
      - --hostname
      - core-ws

  core-wss:
    <<: *core
    container_name: easyplane-core-wss
    command:
      - --config-server
      - ${EASYPLANE_CORE_WSS_URL:-wss://127.0.0.1:22082/token-wss}
      - --machine-id
      - 22222222-2222-4222-8222-222222222222
      - --hostname
      - core-wss

  core-tcp:
    <<: *core
    container_name: easyplane-core-tcp
    command:
      - --config-server
      - ${EASYPLANE_CORE_TCP_URL:-tcp://127.0.0.1:22081/token-tcp}
      - --machine-id
      - 33333333-3333-4333-8333-333333333333
      - --hostname
      - core-tcp

  core-udp:
    <<: *core
    container_name: easyplane-core-udp
    command:
      - --config-server
      - ${EASYPLANE_CORE_UDP_URL:-udp://127.0.0.1:22089/token-udp}
      - --machine-id
      - 77777777-7777-4777-8777-777777777777
      - --hostname
      - core-udp

  core-ws-secure:
    <<: *core
    container_name: easyplane-core-ws-secure
    command:
      - --config-server
      - ${EASYPLANE_CORE_WS_URL:-ws://127.0.0.1:22080/token-ws}
      - --machine-id
      - 44444444-4444-4444-8444-444444444444
      - --hostname
      - core-ws-secure
      - --secure-mode

  core-plain:
    <<: *core
    container_name: easyplane-core-plain
    command:
      - --config-server
      - ${EASYPLANE_CORE_PLAIN_URL:-ws://127.0.0.1:22084/token-plain}
      - --machine-id
      - 55555555-5555-4555-8555-555555555555
      - --hostname
      - core-plain

  core-bad-token:
    <<: *core
    container_name: easyplane-core-bad-token
    command:
      - --config-server
      - ${EASYPLANE_CORE_BAD_TOKEN_URL:-ws://127.0.0.1:22085/wrong-token}
      - --machine-id
      - 66666666-6666-4666-8666-666666666666
      - --hostname
      - core-bad-token

  # Test-only byte pump between the clients and the vitest-hosted control
  # plane (see test/conformance/relay/relay.py).
  m2-relay:
    image: easyplane/easytier-core-test:2.6.4-81487c36
    profiles: ["test"]
    container_name: easyplane-conformance-relay
    entrypoint: ["python3", "/relay.py"]
    volumes:
      - ./test/conformance/relay/relay.py:/relay.py:ro
    environment:
      EASYPLANE_RELAY_PAIRS: 23001:23011,23002:23012,23003:23013,23004:23014,23005:23015
    networks:
      m2:
        ipv4_address: 172.28.0.10
    restart: "no"

  core-m2-a:
    <<: *m2-core
    container_name: easyplane-core-m2-a
    command:
      - --config-server
      - ${EASYPLANE_M2_A_URL:-ws://host.docker.internal:22087/token-m2-a}
      - --machine-id
      - aaaaaaaa-1111-4111-8111-111111111111
      - --hostname
      - core-a
      # EasyTier keeps the DNS zone in local flags, not in NetworkConfig.
      - --tld-dns-zone
      - ${EASYPLANE_M2_DNS_ZONE:-ep.test.}

  core-m2-b:
    <<: *m2-core
    container_name: easyplane-core-m2-b
    command:
      - --config-server
      - ${EASYPLANE_M2_B_URL:-ws://host.docker.internal:22087/token-m2-b}
      - --machine-id
      - bbbbbbbb-2222-4222-8222-222222222222
      - --hostname
      - core-b
      - --tld-dns-zone
      - ${EASYPLANE_M2_DNS_ZONE:-ep.test.}

  core-m2-c:
    <<: *m2-core
    container_name: easyplane-core-m2-c
    command:
      - --config-server
      - ${EASYPLANE_M2_C_URL:-ws://host.docker.internal:22087/token-m2-c}
      - --machine-id
      - cccccccc-3333-4333-8333-333333333333
      - --hostname
      - core-c
      - --tld-dns-zone
      - ${EASYPLANE_M2_DNS_ZONE:-ep.test.}

networks:
  m2:
    name: easyplane-conformance-m2
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
