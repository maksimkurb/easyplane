# Conformance test profile: real easytier-core containers driven by
# test/conformance/*.test.ts.
#
#   docker compose -f docker-compose.test.yml --profile test up -d core-ws
#   bun run test:conformance
#
# The easytier-core containers use host networking so they can reach the
# vitest-hosted server on 127.0.0.1 (Linux only; CI uses Linux runners).
name: easyplane-conformance

x-core: &core
  build:
    context: ./docker/easytier-core
  image: easyplane/easytier-core-test:2.6.4-81487c36
  profiles: ["test"]
  network_mode: host
  cap_add: ["NET_ADMIN"]
  devices: ["/dev/net/tun:/dev/net/tun"]
  restart: "no"
  environment:
    RUST_LOG: ${EASYPLANE_CORE_LOG:-info}
    ET_LOG: ${EASYPLANE_CORE_LOG:-info}

# M2 mesh: three clients on an isolated bridge network. Each container has its
# own network namespace, so every instance gets its own TUN device and routing
# table (host networking would put three TUNs of the same /24 in one namespace).
# They reach the vitest-hosted control plane through host.docker.internal, and
# each other through the compose service names used in the pushed peer URLs.
x-m2-core: &m2-core
  build:
    context: ./docker/easytier-core
  image: easyplane/easytier-core-test:2.6.4-81487c36
  profiles: ["test"]
  cap_add: ["NET_ADMIN"]
  devices: ["/dev/net/tun:/dev/net/tun"]
  networks: ["m2"]
  restart: "no"
  environment:
    RUST_LOG: ${EASYPLANE_CORE_LOG:-info}
    ET_LOG: ${EASYPLANE_CORE_LOG:-info}

# Rendezvous conformance: a real pinned easytier-core public node plus leaf
# containers. The node needs no TUN/capabilities; leaves do (overlay traffic).
x-rv-node: &rv-node
  build:
    context: ./docker/easytier-core
  image: easyplane/easytier-core-test:2.6.4-81487c36
  profiles: ["test"]
  restart: "no"
  environment:
    RUST_LOG: ${EASYPLANE_CORE_LOG:-info}
    ET_LOG: ${EASYPLANE_CORE_LOG:-info}

x-rv-leaf: &rv-leaf
  build:
    context: ./docker/easytier-core
  image: easyplane/easytier-core-test:2.6.4-81487c36
  profiles: ["test"]
  cap_add: ["NET_ADMIN"]
  devices: ["/dev/net/tun:/dev/net/tun"]
  restart: "no"
  environment:
    RUST_LOG: ${EASYPLANE_CORE_LOG:-info}
    ET_LOG: ${EASYPLANE_CORE_LOG:-info}


services:
  core-ws:
    <<: *core
    container_name: easyplane-core-ws
    command:
      - --config-server
      - ${EASYPLANE_CORE_WS_URL:-ws://127.0.0.1:22080/token-ws}
      - --machine-id
      - 11111111-1111-4111-8111-111111111111
      - --hostname
      - core-ws

  core-wss:
    <<: *core
    container_name: easyplane-core-wss
    command:
      - --config-server
      - ${EASYPLANE_CORE_WSS_URL:-wss://127.0.0.1:22082/token-wss}
      - --machine-id
      - 22222222-2222-4222-8222-222222222222
      - --hostname
      - core-wss

  core-tcp:
    <<: *core
    container_name: easyplane-core-tcp
    command:
      - --config-server
      - ${EASYPLANE_CORE_TCP_URL:-tcp://127.0.0.1:22081/token-tcp}
      - --machine-id
      - 33333333-3333-4333-8333-333333333333
      - --hostname
      - core-tcp

  core-udp:
    <<: *core
    container_name: easyplane-core-udp
    command:
      - --config-server
      - ${EASYPLANE_CORE_UDP_URL:-udp://127.0.0.1:22089/token-udp}
      - --machine-id
      - 77777777-7777-4777-8777-777777777777
      - --hostname
      - core-udp

  core-ws-secure:
    <<: *core
    container_name: easyplane-core-ws-secure
    command:
      - --config-server
      - ${EASYPLANE_CORE_WS_URL:-ws://127.0.0.1:22080/token-ws}
      - --machine-id
      - 44444444-4444-4444-8444-444444444444
      - --hostname
      - core-ws-secure
      - --secure-mode

  core-plain:
    <<: *core
    container_name: easyplane-core-plain
    command:
      - --config-server
      - ${EASYPLANE_CORE_PLAIN_URL:-ws://127.0.0.1:22084/token-plain}
      - --machine-id
      - 55555555-5555-4555-8555-555555555555
      - --hostname
      - core-plain

  core-bad-token:
    <<: *core
    container_name: easyplane-core-bad-token
    command:
      - --config-server
      - ${EASYPLANE_CORE_BAD_TOKEN_URL:-ws://127.0.0.1:22085/wrong-token}
      - --machine-id
      - 66666666-6666-4666-8666-666666666666
      - --hostname
      - core-bad-token

  core-m4:
    <<: *core
    container_name: easyplane-core-m4
    command:
      - --config-server
      - ${EASYPLANE_M4_URL:-ws://127.0.0.1:22091/token-m4}
      - --machine-id
      - 88888888-8888-4888-8888-888888888888
      - --hostname
      - core-m4

  # Test-only byte pump between the clients and the vitest-hosted control
  # plane (see test/conformance/relay/relay.py).
  m2-relay:
    image: easyplane/easytier-core-test:2.6.4-81487c36
    profiles: ["test"]
    container_name: easyplane-conformance-relay
    entrypoint: ["python3", "/relay.py"]
    volumes:
      - ./test/conformance/relay/relay.py:/relay.py:ro
    environment:
      EASYPLANE_RELAY_PAIRS: 23001:23011,23002:23012,23003:23013,23004:23014,23005:23015
    networks:
      m2:
        ipv4_address: 172.28.0.10
    restart: "no"

  core-m2-a:
    <<: *m2-core
    container_name: easyplane-core-m2-a
    command:
      - --config-server
      - ${EASYPLANE_M2_A_URL:-ws://host.docker.internal:22087/token-m2-a}
      - --machine-id
      - aaaaaaaa-1111-4111-8111-111111111111
      - --hostname
      - core-a
      # EasyTier keeps the DNS zone in local flags, not in NetworkConfig.
      - --tld-dns-zone
      - ${EASYPLANE_M2_DNS_ZONE:-ep.test.}

  core-m2-b:
    <<: *m2-core
    container_name: easyplane-core-m2-b
    command:
      - --config-server
      - ${EASYPLANE_M2_B_URL:-ws://host.docker.internal:22087/token-m2-b}
      - --machine-id
      - bbbbbbbb-2222-4222-8222-222222222222
      - --hostname
      - core-b
      - --tld-dns-zone
      - ${EASYPLANE_M2_DNS_ZONE:-ep.test.}

  core-m2-c:
    <<: *m2-core
    container_name: easyplane-core-m2-c
    command:
      - --config-server
      - ${EASYPLANE_M2_C_URL:-ws://host.docker.internal:22087/token-m2-c}
      - --machine-id
      - cccccccc-3333-4333-8333-333333333333
      - --hostname
      - core-c
      - --tld-dns-zone
      - ${EASYPLANE_M2_DNS_ZONE:-ep.test.}

  # --- Rendezvous conformance ------------------------------------------------
  # The public node is attached to three isolated data networks; each leaf sees
  # only one of them, so leaf-to-leaf reachability is controlled by the test.
  # A separate control network per leaf carries only the config-server tunnel
  # (plus the relay), so leaves never share a network when they must not.
  rendezvous:
    <<: *rv-node
    container_name: easyplane-rendezvous
    entrypoint: ["/bin/sh", "/opt/rendezvous/entrypoint.sh"]
    volumes:
      - ./docker/rendezvous/entrypoint.sh:/opt/rendezvous/entrypoint.sh:ro
    environment:
      RUST_LOG: ${EASYPLANE_CORE_LOG:-info}
      ET_LOG: ${EASYPLANE_CORE_LOG:-info}
      RENDEZVOUS_NETWORK_NAME: ${EASYPLANE_RV_NETWORK_NAME:-rv-node-net}
      RENDEZVOUS_NETWORK_SECRET: ${EASYPLANE_RV_SECRET:-rv-conformance-secret}
      RENDEZVOUS_RELAY_DATA: ${EASYPLANE_RV_RELAY_DATA:-false}
      RENDEZVOUS_PRIVATE_MODE: ${EASYPLANE_RV_PRIVATE_MODE:-true}
      RENDEZVOUS_NETWORK_WHITELIST: ${EASYPLANE_RV_WHITELIST:-*}
      RENDEZVOUS_RELAY_ALL_PEER_RPC: ${EASYPLANE_RV_RELAY_ALL_PEER_RPC:-false}
      RENDEZVOUS_LISTENERS: tcp://0.0.0.0:11010
      RENDEZVOUS_HOSTNAME: rv-node
    networks:
      rv-direct:
        ipv4_address: 172.29.0.10
      rv-a:
        ipv4_address: 172.29.1.10
      rv-b:
        ipv4_address: 172.29.2.10

  rv-relay:
    image: easyplane/easytier-core-test:2.6.4-81487c36
    profiles: ["test"]
    container_name: easyplane-rv-relay
    entrypoint: ["python3", "/relay.py"]
    volumes:
      - ./test/conformance/relay/relay.py:/relay.py:ro
    environment:
      EASYPLANE_RELAY_PAIRS: 23021:23031,23022:23032,23023:23033,23024:23034
    networks:
      rv-ctl-a:
        ipv4_address: 172.32.1.10
      rv-ctl-b:
        ipv4_address: 172.32.2.10
      rv-ctl-c:
        ipv4_address: 172.32.3.10
      rv-ctl-d:
        ipv4_address: 172.32.4.10

  core-rv-direct-a:
    <<: *rv-leaf
    container_name: easyplane-core-rv-direct-a
    networks:
      rv-direct:
        ipv4_address: 172.29.0.11
      rv-ctl-a:
        ipv4_address: 172.32.1.11
    command:
      - --config-server
      - ${EASYPLANE_RV_DIRECT_A_URL:-ws://172.32.1.10:23021/token-rv-direct-a}
      - --machine-id
      - 1a1a1a1a-1111-4111-8111-111111111111
      - --hostname
      - core-rv-direct-a

  core-rv-direct-b:
    <<: *rv-leaf
    container_name: easyplane-core-rv-direct-b
    networks:
      rv-direct:
        ipv4_address: 172.29.0.12
      rv-ctl-b:
        ipv4_address: 172.32.2.11
    command:
      - --config-server
      - ${EASYPLANE_RV_DIRECT_B_URL:-ws://172.32.2.10:23022/token-rv-direct-b}
      - --machine-id
      - 1b1b1b1b-2222-4222-8222-222222222222
      - --hostname
      - core-rv-direct-b

  core-rv-iso-a:
    <<: *rv-leaf
    container_name: easyplane-core-rv-iso-a
    networks:
      rv-a:
        ipv4_address: 172.29.1.11
      rv-ctl-c:
        ipv4_address: 172.32.3.11
    command:
      - --config-server
      - ${EASYPLANE_RV_ISO_A_URL:-ws://172.32.3.10:23023/token-rv-iso-a}
      - --machine-id
      - 2a2a2a2a-3333-4333-8333-333333333333
      - --hostname
      - core-rv-iso-a

  core-rv-iso-b:
    <<: *rv-leaf
    container_name: easyplane-core-rv-iso-b
    networks:
      rv-b:
        ipv4_address: 172.29.2.11
      rv-ctl-d:
        ipv4_address: 172.32.4.11
    command:
      - --config-server
      - ${EASYPLANE_RV_ISO_B_URL:-ws://172.32.4.10:23024/token-rv-iso-b}
      - --machine-id
      - 2b2b2b2b-4444-4444-8444-444444444444
      - --hostname
      - core-rv-iso-b

  # A plain, non-managed leaf with a DIFFERENT network secret. Private mode must
  # reject it; no TUN is needed because it should never become a peer.
  core-rv-wrong-secret:
    <<: *rv-node
    container_name: easyplane-core-rv-wrong-secret
    networks:
      rv-direct:
        ipv4_address: 172.29.0.13
    volumes:
      - ./test/conformance/rendezvous/wrong-secret.toml:/cfg.toml:ro
    command: ["-c", "/cfg.toml", "--secure-mode", "true"]

networks:
  m2:
    name: easyplane-conformance-m2
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  rv-direct:
    name: easyplane-conformance-rv-direct
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
  rv-a:
    name: easyplane-conformance-rv-a
    ipam:
      config:
        - subnet: 172.29.1.0/24
          gateway: 172.29.1.1
  rv-b:
    name: easyplane-conformance-rv-b
    ipam:
      config:
        - subnet: 172.29.2.0/24
          gateway: 172.29.2.1
  rv-ctl-a:
    name: easyplane-conformance-rv-ctl-a
    ipam:
      config:
        - subnet: 172.32.1.0/24
          gateway: 172.32.1.1
  rv-ctl-b:
    name: easyplane-conformance-rv-ctl-b
    ipam:
      config:
        - subnet: 172.32.2.0/24
          gateway: 172.32.2.1
  rv-ctl-c:
    name: easyplane-conformance-rv-ctl-c
    ipam:
      config:
        - subnet: 172.32.3.0/24
          gateway: 172.32.3.1
  rv-ctl-d:
    name: easyplane-conformance-rv-ctl-d
    ipam:
      config:
        - subnet: 172.32.4.0/24
          gateway: 172.32.4.1
