# Reusable container build: one multi-arch image, pushed to ghcr.io.
#
#   * called by the `publish` job in ci.yml after every gate is green on main
#     (tags: edge, sha-<short>);
#   * called by release.yml for a versioned release or a pushed v* tag
#     (tags: X.Y.Z, X.Y, X, latest, sha-<short>).
#
# The caller decides the tag set through `kind`/`version`; every push also gets
# a sha-<short> tag, so an image can always be traced back to a commit.
name: image

on:
  workflow_call:
    inputs:
      kind:
        description: "Tag set to publish: edge or release"
        required: true
        type: string
      version:
        description: Value for the version label and EASYPLANE_VERSION (X.Y.Z, or edge on main)
        required: true
        type: string
      sha:
        description: Commit to build
        required: true
        type: string
      push:
        description: Push to ghcr.io (false builds the image without publishing)
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Resolve image name (ghcr.io requires lowercase)
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: scripts/docker-tags.sh --github-output "${{ inputs.kind }}" "${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      # metadata-action lowercases the image name too; it also emits the
      # org.opencontainers.image.created label. source/revision/version are
      # overridden here because a release build is not always checked out at a
      # v* tag; licenses is not a default label.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ steps.image.outputs.name }}
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=GPL-3.0

      - name: Build and push linux/amd64, linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EASYPLANE_VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
