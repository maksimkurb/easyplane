name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: bun install --frozen-lockfile
      - name: Fail on proto drift
        run: scripts/check-protos.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "/tmp/easyplane-easytier-ref/easytier-ref -> target"
      - run: bun install --frozen-lockfile
      - name: Build the pinned conformance client (real easytier-core)
        run: scripts/build-test-client.sh
      - name: Build the conformance image
        run: docker compose -f docker-compose.test.yml --profile test build
      - name: Conformance (real easytier-core over ws/wss/tcp + secure mode)
        run: bun run test:conformance
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml --profile test logs --no-color || true
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml --profile test down --remove-orphans || true
