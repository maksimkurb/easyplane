name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: bun install --frozen-lockfile
      - name: Fail on proto drift
        run: scripts/check-protos.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit
      - name: Web lint and tests
        run: bun run lint && bun run test:web
      - name: Web production build
        run: bun run web:build
      - name: Storybook static build (smoke)
        run: bun run --cwd apps/web storybook:build
      - name: Fail on generated OpenAPI / client drift
        run: |
          bun run openapi:generate
          bun run --cwd apps/web api:generate
          git diff --exit-code -- apps/server/openapi.json apps/web/src/api/generated

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: easyplane
          POSTGRES_PASSWORD: easyplane
          POSTGRES_DB: easyplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easyplane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Integration (Postgres + mock OIDC)
        env:
          EASYPLANE_TEST_DATABASE_URL: postgres://easyplane:easyplane@127.0.0.1:5432/easyplane
        run: bun run test:integration

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: easyplane
          POSTGRES_PASSWORD: easyplane
          POSTGRES_DB: easyplane
        ports:
          - 22090:5432
        options: >-
          --health-cmd "pg_isready -U easyplane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (needed by prost-wkt-types when building easytier-core)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: bun install --frozen-lockfile
      - name: Build the pinned conformance client (real easytier-core)
        run: scripts/build-test-client.sh
      - name: Build the conformance image
        run: docker compose -f docker-compose.test.yml --profile test build
      - name: "Conformance (real easytier-core: M0/M1/M2/M3/M4 incl. UDP and imports)"
        env:
          EASYPLANE_TEST_DATABASE_URL: postgres://easyplane:easyplane@127.0.0.1:22090/easyplane
        run: bun run test:conformance
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml --profile test logs --no-color || true
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml --profile test down --remove-orphans || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment image
        run: docker build -f docker/server.Dockerfile -t easyplane/server:ci .

  # Publish `edge` + `sha-<short>` only from main and only after every gate
  # above is green. Pull requests stop at the `docker` job, which builds the
  # image without pushing anything.
  publish:
    needs: [protos, unit, integration, conformance, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      kind: edge
      version: edge
      sha: ${{ github.sha }}
      push: true

  # Manual-only: starts hundreds of simulated config-server clients against the
  # real server and prints the numbers from docs/PERFORMANCE.md to the log.
  # Not on every push because it takes ~1 minute and is not a correctness gate.
  load:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: easyplane
          POSTGRES_PASSWORD: easyplane
          POSTGRES_DB: easyplane
        ports:
          - 22090:5432
        options: >-
          --health-cmd "pg_isready -U easyplane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Load test (200 simulated clients)
        env:
          EASYPLANE_TEST_DATABASE_URL: postgres://easyplane:easyplane@127.0.0.1:22090/easyplane
          EASYPLANE_LOAD_CLIENTS: "200"
        run: bun run test:load
