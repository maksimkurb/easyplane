# Standalone EasyPlane rendezvous node for a VPS (no panel, no database).
#
# A stock easytier-core running as a public node whose only job is helping
# devices find each other: initial contact, peer RPC, OSPF route exchange and
# NAT hole-punch coordination. User data is NOT forwarded unless
# RENDEZVOUS_RELAY_DATA=true (the CGNAT/symmetric-NAT fallback).
#
# Files needed next to this file:
#   docker/rendezvous/entrypoint.sh   (from this repository)
#   .env                              (the variables below; never commit it)
#
#   docker compose -f docker-compose.rendezvous.yml up -d
#
# Publish/forward on the VPS firewall:
#   TCP 11010  (peer listener)
#   UDP 11010  (peer listener, needed for UDP hole punching)
#   TCP 11011  (ws peer listener; optional)
# Point the panel at it:
#   EASYPLANE_RENDEZVOUS_ENDPOINTS=tcp://rv.example.com:11010,udp://rv.example.com:11010,ws://rv.example.com:11011
#   EASYPLANE_RENDEZVOUS_SECRET=<the same value as RENDEZVOUS_NETWORK_SECRET>
#   EASYPLANE_RENDEZVOUS_NETWORK_NAME=<the same value as RENDEZVOUS_NETWORK_NAME>
#   EASYPLANE_RENDEZVOUS_RELAY_DATA=<true|false, matching this node>
#
# If DNS is not set yet, RENDEZVOUS_MAPPED_LISTENERS is not needed; peers use
# the addresses you put in EASYPLANE_RENDEZVOUS_ENDPOINTS.

name: easyplane-rendezvous

services:
  rendezvous:
    image: ${RENDEZVOUS_IMAGE:-easytier/easytier:v2.7.0}
    restart: unless-stopped
    # The entrypoint reads the RENDEZVOUS_* variables, renders a TOML config and
    # execs easytier-core. The network secret is never logged.
    entrypoint: ["/bin/sh", "/opt/rendezvous/entrypoint.sh"]
    environment:
      RENDEZVOUS_NETWORK_NAME: ${RENDEZVOUS_NETWORK_NAME:-easyplane-rendezvous}
      RENDEZVOUS_NETWORK_SECRET: ${RENDEZVOUS_NETWORK_SECRET:?set RENDEZVOUS_NETWORK_SECRET in .env}
      RENDEZVOUS_RELAY_DATA: ${RENDEZVOUS_RELAY_DATA:-false}
      RENDEZVOUS_PRIVATE_MODE: ${RENDEZVOUS_PRIVATE_MODE:-true}
      RENDEZVOUS_SECURE_MODE: ${RENDEZVOUS_SECURE_MODE:-true}
      RENDEZVOUS_NETWORK_WHITELIST: ${RENDEZVOUS_NETWORK_WHITELIST:-*}
      RENDEZVOUS_RELAY_ALL_PEER_RPC: ${RENDEZVOUS_RELAY_ALL_PEER_RPC:-false}
      RENDEZVOUS_LISTENERS: ${RENDEZVOUS_LISTENERS:-tcp://0.0.0.0:11010,udp://0.0.0.0:11010,ws://0.0.0.0:11011}
      RENDEZVOUS_HOSTNAME: ${RENDEZVOUS_HOSTNAME:-rendezvous}
      RENDEZVOUS_FOREIGN_RELAY_BPS_LIMIT: ${RENDEZVOUS_FOREIGN_RELAY_BPS_LIMIT:-}
      RENDEZVOUS_MAPPED_LISTENERS: ${RENDEZVOUS_MAPPED_LISTENERS:-}
    volumes:
      - ./docker/rendezvous/entrypoint.sh:/opt/rendezvous/entrypoint.sh:ro
    ports:
      - "${RENDEZVOUS_TCP_BIND:-0.0.0.0:11010}:11010"
      - "${RENDEZVOUS_UDP_BIND:-0.0.0.0:11010}:11010/udp"
      - "${RENDEZVOUS_WS_BIND:-0.0.0.0:11011}:11011"
    # No TUN device and no capabilities: this node never touches the host
    # network stack, it only accepts and relays overlay traffic.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "easytier-cli -o json node >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
