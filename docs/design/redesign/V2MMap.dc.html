<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home lab map, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./v2.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.v2 .mn{position:absolute;z-index:2;width:80px;display:flex;flex-direction:column;align-items:center;gap:4px}.v2 .mn .c{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--line-2),var(--shadow);display:grid;place-items:center;color:var(--fg-2);position:relative}.v2 .mn .l{font-size:11.5px;font-weight:600;line-height:14px;padding:1px 6px;border-radius:6px;background:var(--surface);white-space:nowrap}.v2 .mn.off{opacity:.6}.v2 .mn.sel .c{box-shadow:0 0 0 2px var(--brand),var(--shadow-lg);color:var(--brand-text)}.v2 .mn .s{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--ok-dot);box-shadow:0 0 0 2px var(--surface)}.v2 .mn.off .s{background:var(--fg-3)}</style>
</helmet>
<div class="v2 phone {{tc}}">
  <header class="mtop">
    <a class="btn ghost lg icon" href="V2MNetworks.dc.html" aria-label="Back to networks"><i class="ic i-chev-l s20"></i></a>
    <span class="ttl">Home lab</span>
    <button class="btn ghost lg icon" aria-label="Network actions"><i class="ic i-more"></i></button>
  </header>
  <nav class="tabs" aria-label="Network sections" style="margin:0;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--line);flex:none">
    <a class="tab" href="V2MDevices.dc.html">Devices <span class="cnt warn">1 waiting</span></a>
    <a class="tab on" href="V2MMap.dc.html" aria-current="page">Map</a>
    <a class="tab" href="V2Access.dc.html">Access</a>
    <a class="tab" href="V2Settings.dc.html">Settings</a>
  </nav>

  <div class="map" style="flex:1;border-radius:0;box-shadow:none">
    <svg width="390" height="400" viewBox="0 0 390 400" style="position:absolute;left:0;top:0" fill="none" aria-hidden="true">
      <line x1="195" y1="190" x2="80" y2="80" style="stroke:var(--ok-dot)" stroke-width="2"></line>
      <line x1="195" y1="190" x2="310" y2="80" style="stroke:var(--ok-dot)" stroke-width="2"></line>
      <line x1="195" y1="190" x2="80" y2="300" style="stroke:var(--ok-dot)" stroke-width="2"></line>
      <line x1="195" y1="190" x2="310" y2="300" style="stroke:var(--ok-dot)" stroke-width="2"></line>
      <line x1="80" y1="80" x2="40" y2="190" stroke="#e19a12" stroke-width="2" stroke-dasharray="5 4"></line>
      <line x1="195" y1="190" x2="350" y2="190" stroke="#e19a12" stroke-width="2" stroke-dasharray="5 4"></line>
    </svg>
    <span class="ping" style="left:137px;top:135px"><span class="q"></span>14 ms</span>
    <span class="ping" style="left:252px;top:135px"><span class="q"></span>2 ms</span>
    <span class="ping" style="left:137px;top:245px"><span class="q"></span>3 ms</span>
    <span class="ping" style="left:252px;top:245px"><span class="q"></span>2 ms</span>
    <span class="ping relay mid" style="left:274px;top:190px"><span class="q"></span>38</span>
    <button class="mn sel" style="left:155px;top:168px" aria-label="nas-01, selected"><span class="c"><i class="ic i-server"></i><span class="s"></span></span><span class="l">nas-01</span></button>
    <button class="mn" style="left:40px;top:58px" aria-label="relay-fra"><span class="c"><i class="ic i-server"></i><span class="s"></span></span><span class="l">relay-fra</span></button>
    <button class="mn" style="left:270px;top:58px" aria-label="desktop"><span class="c"><i class="ic i-monitor"></i><span class="s"></span></span><span class="l">desktop</span></button>
    <button class="mn off" style="left:0px;top:168px" aria-label="laptop-maxim, offline"><span class="c"><i class="ic i-laptop"></i><span class="s"></span></span><span class="l">laptop-maxim</span></button>
    <button class="mn" style="left:310px;top:168px" aria-label="phone-anna"><span class="c"><i class="ic i-phone"></i><span class="s"></span></span><span class="l">phone-anna</span></button>
    <button class="mn" style="left:40px;top:278px" aria-label="rpi-garage"><span class="c"><i class="ic i-cpu"></i><span class="s"></span></span><span class="l">rpi-garage</span></button>
    <button class="mn" style="left:270px;top:278px" aria-label="media-pc"><span class="c"><i class="ic i-monitor"></i><span class="s"></span></span><span class="l">media-pc</span></button>
  </div>

  <section class="sheet" aria-label="nas-01">
    <div class="grab"></div>
    <div class="row" style="gap:12px;padding:8px 8px 12px 16px">
      <span class="dicon lg"><i class="ic i-server s20"></i></span>
      <div style="flex:1;min-width:0"><div class="dname"><h2>nas-01</h2><span class="chip brand">Hub</span></div><div class="dsub"><span class="dot on"></span>Connected · <span class="mono" style="font-size:12px">10.144.144.2</span></div></div>
      <button class="btn ghost lg icon" aria-label="Close"><i class="ic i-x"></i></button>
    </div>
    <div class="line" style="min-height:48px;padding:0 16px"><span class="grow m">relay-fra</span><span class="chip ok">Direct</span><span class="mono t3" style="font-size:12px;width:44px;text-align:right">14 ms</span></div>
    <div class="line" style="min-height:48px;padding:0 16px"><span class="grow m">desktop</span><span class="chip ok">Direct</span><span class="mono t3" style="font-size:12px;width:44px;text-align:right">2 ms</span></div>
    <div class="line" style="min-height:48px;padding:0 16px"><span class="grow m">phone-anna</span><span class="chip warn">Relayed</span><span class="mono t3" style="font-size:12px;width:44px;text-align:right">38 ms</span></div>
    <div style="padding:12px 16px 28px"><a class="btn sec lg full" href="V2Device.dc.html">Open device<i class="ic i-arrow-r s16"></i></a></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return { tc: this.props.theme === 'dark' ? 'dark' : '' }; } }
</script>
</body>
</html>
