# EasyPlane deployment from the published image (no local build).
#
#   cp .env.example .env     # same .env as docker-compose.yml
#   docker compose -f docker-compose.ghcr.yml up -d --pull always
#
# Pin a release with EASYPLANE_IMAGE_TAG (default: latest):
#
#   EASYPLANE_IMAGE_TAG=1.2.3 docker compose -f docker-compose.ghcr.yml up -d
#
# Tags: releases publish X.Y.Z, X.Y, X and latest; main publishes edge and
# sha-<short>. The package must be public, or run `docker login ghcr.io` once.
# This file is an alternative to docker-compose.yml (which builds from source),
# not an addition to it: use one or the other.
#
# EASYPLANE_IMAGE_TAG/EASYPLANE_IMAGE_OWNER may also live in .env: compose
# reads that file for interpolation before starting anything.

name: easyplane

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easyplane}
      POSTGRES_USER: ${POSTGRES_USER:-easyplane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-easyplane} -d ${POSTGRES_DB:-easyplane}
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/${EASYPLANE_IMAGE_OWNER:-maksimkurb}/easyplane:${EASYPLANE_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      EASYPLANE_DATABASE_URL: postgres://${POSTGRES_USER:-easyplane}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-easyplane}
      EASYPLANE_HOST: 0.0.0.0
      EASYPLANE_HTTP_PORT: "8080"
      EASYPLANE_WEB_DIR: /app/apps/web/dist
    ports:
      - "${EASYPLANE_HTTP_BIND:-0.0.0.0:8080}:8080"
      # EasyTier config-server listeners (place a TLS proxy in front for wss).
      - "${EASYPLANE_TCP_BIND:-0.0.0.0:22020}:22020"
      - "${EASYPLANE_WS_BIND:-0.0.0.0:22023}:22023"
      # UDP config-server (M4). Also set EASYPLANE_UDP_PORT=22021 in .env.
      # - "${EASYPLANE_UDP_BIND:-0.0.0.0:22021}:22021/udp"

  # Bundled rendezvous node, opt-in. Same service as in docker-compose.yml;
  # the entrypoint script is mounted from the checkout (no local image build).
  #   docker compose -f docker-compose.ghcr.yml --profile rendezvous up -d
  rendezvous:
    profiles: ["rendezvous"]
    image: ${RENDEZVOUS_IMAGE:-easytier/easytier:v2.7.0}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/rendezvous/entrypoint.sh"]
    environment:
      RENDEZVOUS_NETWORK_NAME: ${RENDEZVOUS_NETWORK_NAME:-easyplane-rendezvous}
      RENDEZVOUS_NETWORK_SECRET: ${RENDEZVOUS_NETWORK_SECRET:-}
      RENDEZVOUS_RELAY_DATA: ${RENDEZVOUS_RELAY_DATA:-false}
      RENDEZVOUS_PRIVATE_MODE: ${RENDEZVOUS_PRIVATE_MODE:-true}
      RENDEZVOUS_SECURE_MODE: ${RENDEZVOUS_SECURE_MODE:-true}
      RENDEZVOUS_NETWORK_WHITELIST: ${RENDEZVOUS_NETWORK_WHITELIST:-*}
      RENDEZVOUS_RELAY_ALL_PEER_RPC: ${RENDEZVOUS_RELAY_ALL_PEER_RPC:-false}
      RENDEZVOUS_LISTENERS: ${RENDEZVOUS_LISTENERS:-tcp://0.0.0.0:11010,udp://0.0.0.0:11010,ws://0.0.0.0:11011}
      RENDEZVOUS_HOSTNAME: ${RENDEZVOUS_HOSTNAME:-rendezvous}
      RENDEZVOUS_FOREIGN_RELAY_BPS_LIMIT: ${RENDEZVOUS_FOREIGN_RELAY_BPS_LIMIT:-}
      RENDEZVOUS_MAPPED_LISTENERS: ${RENDEZVOUS_MAPPED_LISTENERS:-}
    volumes:
      - ./docker/rendezvous/entrypoint.sh:/opt/rendezvous/entrypoint.sh:ro
    ports:
      - "${RENDEZVOUS_TCP_BIND:-0.0.0.0:11010}:11010"
      - "${RENDEZVOUS_UDP_BIND:-0.0.0.0:11010}:11010/udp"
      - "${RENDEZVOUS_WS_BIND:-0.0.0.0:11011}:11011"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "easytier-cli -o json node >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
