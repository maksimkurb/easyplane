# Conformance-only leaf with a DIFFERENT network secret than the rendezvous
# node. Private mode must reject the connection with
# "private mode is turned on, foreign network secret mismatch".
#
# It is started with --secure-mode true: the secret proof that private mode
# verifies is only exchanged in EasyTier secure mode. That is exactly why the
# panel pushes secure mode to devices in a network that uses the node.
instance_name = "rv-wrong-secret"
hostname = "core-rv-wrong-secret"
listeners = ["tcp://0.0.0.0:11011"]

[[peer]]
uri = "tcp://172.29.0.10:11010"

[network_identity]
network_name = "rv-wrong-secret-net"
network_secret = "a-different-secret"

[flags]
no_tun = true
private_mode = false
